<!DOCTYPE html>
<html>
<head>
<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
<meta charset="utf-8">
<title>B3313</title>
<style>body,html{margin:0;padding:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#121212;color:#fff;font-family:Arial,sans-serif;}#game-container{text-align:center;width:100%;height:100%;}#loading-progress{font-size:18px;margin-top:20px;padding:10px;background:rgba(255,255,255,0.1);border-radius:8px;display:inline-block;}</style>
</head>
<body>
<div id="game-container"><div id="game"></div><div id="loading-progress">Loading: 0/0</div><div id="first-time">First-time loading may take longer...</div></div>
<script>
window.gameconfig = {name: "b3313", url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@63f44d001c95b775db57a9796ec7668541975062/B3113/b3313.z64", core: "n64", min: 1, max: 4};
function mergeFiles(fileParts, cb) {
  return new Promise((resolve, reject) => {
    let buffers = [];
    function fetchPart(index) {
      if (index >= fileParts.length) {
        let mergedBlob = new Blob(buffers);
        resolve(URL.createObjectURL(mergedBlob));
        return;
      }
      fetch(fileParts[index]).then(r => r.arrayBuffer()).then(data => { buffers.push(data); fetchPart(index + 1); }).catch(reject);
      cb(index);
    }
    fetchPart(0);
  });
}
function getParts(file, start, end) {
  let parts = [];
  for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
  return parts;
}
var parts = getParts(window.gameconfig.url, window.gameconfig.min, window.gameconfig.max);
var totalParts = parts.length;
function updateLoadingProgress(loaded) {
  document.getElementById("loading-progress").textContent = loaded === 0 ? "Loading: 0/0" : `Loading: ${loaded}/${totalParts}`;
}
mergeFiles(parts, updateLoadingProgress).then(gameUrl => {
  document.getElementById("loading-progress").remove();
  document.getElementById("first-time").remove();
  EJS_player = "#game";
  EJS_core = window.gameconfig.core;
  EJS_gameName = window.gameconfig.name;
  EJS_color = "#0064ff";
  EJS_startOnLoaded = true;
  EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
  EJS_gameUrl = gameUrl;
  const script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
  document.body.appendChild(script);
}).catch(e => { console.error(e); document.getElementById("loading-progress").textContent = "Error loading game."; });
</script>
</body>
</html>
