<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cave Story</title>
<base href="https://cdn.jsdelivr.net/gh/Stinkalistic/UGS@main/MISC/cavestory/">
<style>body{margin:0;background:#000;color:#ccc;font-family:monospace;display:flex;justify-content:center;}canvas{width:100vw;}</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading" style="position:absolute;text-align:center;">Downloading...</div>
<script>
var loadScript = (src) => {
  var s = document.createElement('script');
  s.src = src;
  document.head.appendChild(s);
};
loadScript('index.js');
var Module = { canvas: document.getElementById('canvas'), setStatus: function(t){ document.getElementById('loading').innerHTML = t; } };
</script>
</body>
</html>
