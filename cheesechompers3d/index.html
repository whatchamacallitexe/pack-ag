<!DOCTYPE html>
<html>
<head>
<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
<meta charset="utf-8">
<title>Cheese Chompers 3D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/cheesechomp@7adf6b379977b88fe2becd36070c546d462f1eec/TemplateData/styles.css">
</head>
<body>
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" tabindex="-1" width="940" height="598"></canvas>
<div id="unity-loading-bar"><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
</div>
<script>
var buildUrl = "https://cdn.jsdelivr.net/gh/bubbls/cheesechomp@7adf6b379977b88fe2becd36070c546d462f1eec/Build";
var canvas = document.querySelector("#unity-canvas");
var progressBarFull = document.querySelector("#unity-progress-bar-full");
async function fetchAndCombineParts(partUrls) {
  const buffers = [];
  for (const partUrl of partUrls) {
    const response = await fetch(partUrl);
    buffers.push(await response.arrayBuffer());
  }
  return URL.createObjectURL(new Blob(buffers));
}
const dataParts = Array.from({length:10}, (_,i) => buildUrl + "/CheeseChompers3dWebUpdate.data.unityweb.part" + (i+1));
const wasmParts = Array.from({length:3}, (_,i) => buildUrl + "/CheeseChompers3dWebUpdate.wasm.unityweb.part" + (i+1));
(async () => {
  const dataUrl = await fetchAndCombineParts(dataParts);
  const wasmUrl = await fetchAndCombineParts(wasmParts);
  var config = {
    dataUrl: dataUrl,
    frameworkUrl: buildUrl + "/CheeseChompers3dWebUpdate.framework.js.unityweb",
    codeUrl: wasmUrl,
    companyName: "DefaultCompany",
    productName: "CheeseChompers 3D",
    productVersion: "0.1"
  };
  var script = document.createElement("script");
  script.src = buildUrl + "/CheeseChompers3dWebUpdate.loader.js";
  script.onload = () => createUnityInstance(canvas, config, (p) => { progressBarFull.style.width = (p*100)+"%"; });
  document.body.appendChild(script);
})();
</script>
</body>
</html>
