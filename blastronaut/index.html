<!DOCTYPE html>
<html>
<head>
<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
<base href="https://cdn.jsdelivr.net/gh/Stinkalistic/UGS@main/UNITY/blastronaut/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>Blastronaut</title>
<style>
body { touch-action: none; margin: 0; border: 0; padding: 0; text-align: center; background-color: black; }
#canvas { display: block; margin: 0; color: white; }
</style>
</head>
<body>
<canvas id="canvas">HTML5 canvas appears to be unsupported in the current browser.</canvas>
<div id="status">
<div id="status-progress" style="display: none;"><div id="status-progress-inner"></div></div>
<div id="status-indeterminate" style="display: none;"></div>
<div id="status-notice" class="godot" style="display: none;"></div>
</div>
<script type="text/javascript" src="index.js"></script>
<script type="text/javascript">
var engine = new Engine;
(function() {
  const EXECUTABLE_NAME = 'index';
  const MAIN_PACK = 'index.pck';
  var canvas = document.getElementById('canvas');
  engine.setCanvas(canvas);
  engine.startGame(EXECUTABLE_NAME, MAIN_PACK);
})();
</script>
</body>
</html>
