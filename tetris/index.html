<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
<meta charset="utf-8">
<title>Tetris</title>
<style>
body { margin: 0; background: #000; overflow: hidden; }
#game { width: 100vw; height: 100vh; }
#startButton {
  display: block; width: 160px; height: 40px; background-color: #4CAF50; color: white;
  text-align: center; font-size: 16px; margin: 20px auto; padding: 10px 20px; border: none;
  border-radius: 8px; cursor: pointer; font-family: 'Press Start 2P', cursive;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div id="game" style="display:none;"></div>
<button id="startButton">PLAY</button>
<script>
document.getElementById("startButton").addEventListener("click", function() {
  document.getElementById("game").style.display = "block";
  document.getElementById("startButton").style.display = "none";
  window.EJS_player = "#game";
  window.EJS_core = "nes";
  window.EJS_color = "#000000";
  window.EJS_startOnLoaded = true;
  window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data";
  window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@35728ab339fe19751152ee79e06fe3b419bd8b59/Tetris%20(USA).zip";
  var script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js";
  document.body.appendChild(script);
});
</script>
</body>
</html>
