<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>Bit Planes</title>
<link href="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/bit-planes/styles.css" rel="stylesheet">
</head>
<body>
<main>
<section class="welcome">
<h1><i class="logo"></i> Bit Planes <i class="logo"></i></h1>
<p><strong>Controls:</strong><br></p>
<ul>
<li>Arrows ↑↓ — thrust level.</li>
<li>Arrows ←→ — elevator controls.</li>
<li>Space — fire a gun. X — deploy a missile.</li>
<li>C — catapult / parachute and get new plane at the barn.</li>
</ul>
<form id="game">
<label><input type="text" name="nickname" placeholder="Nickname"></label>
<p><strong>Game mode:</strong></p>
<div class="game-modes">
<div><label><input type="radio" name="mode" value="death-match" checked> Death match</label></div>
<div><label><input type="radio" name="mode" value="teams"> Teams</label></div>
<div><label><input type="radio" name="mode" value="duel"> Duel</label></div>
<div><label><input type="radio" name="mode" value="survival"> Survival</label></div>
</div>
<div class="action"><button class="btn">‣ Start</button></div>
</form>
</section>
</main>
<canvas id="canvas"></canvas>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/bit-planes/index.js"></script>
</body>
</html>
